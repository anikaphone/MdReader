[package]
name = "mdreader"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "http", "image", "svg", "svg_text"] }
egui_commonmark = { version = "0.25.0", features = ["better_syntax_highlighting", "load-images", "pulldown_cmark", "svg"] }
egui_commonmark_backend = { version = "0.25.0", features = ["better_syntax_highlighting"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.15"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
arboard = "3.4"
memmap2 = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes"] }


[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = false
codegen-units = 256
panic = "abort"
strip = true
